name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: gofmt -l . | grep . && exit 1 || true
      - run: go vet ./...
      - run: go test ./... -count=1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mocki .
      - run: |
          mkdir /tmp/data && cp examples/users.json /tmp/data/
          docker run -d --name mocki -p 3000:3000 -v /tmp/data:/data mocki
          sleep 2
          curl -sf http://localhost:3000/users | grep -q "Ada"
